// A small teaching checker for the explicitly closed markup used in Lesson 7.
// It checks the assignment, not full HTML conformance; browser error recovery is
// intentionally not used to give credit for a missing head/body or crossing tags.
const lessonVoidTags=new Set('area base br col embed hr img input link meta param source track wbr'.split(' '));
function readLessonHTML(value){
 const source=String(value),root={tag:'#document',children:[],parent:null},stack=[root],nodes=[],issues=[];let i=0,doctype=false;
 const lineAt=p=>source.slice(0,p).split('\n').length;
 const issue=(pos,message)=>issues.push({line:lineAt(pos),message});
 function text(s){if(s)stack[stack.length-1].children.push({tag:'#text',text:s,children:[]});}
 while(i<source.length){
  if(source.startsWith('<!--',i)){const end=source.indexOf('-->',i+4);if(end<0){issue(i,'Chú thích chưa có dấu kết thúc -->.');break;}i=end+3;continue;}
  if(source[i]!=='<'){const next=source.indexOf('<',i);text(source.slice(i,next<0?source.length:next));i=next<0?source.length:next;continue;}
  const start=i;let quote=null,j=i+1;
  for(;j<source.length;j++){const c=source[j];if(quote){if(c===quote)quote=null;}else if(c==='"'||c==="'")quote=c;else if(c==='>')break;}
  if(j>=source.length){issue(i,quote?'Giá trị thuộc tính chưa đóng dấu ngoặc kép hoặc nháy đơn.':'Thẻ chưa kết thúc bằng dấu >.');break;}
  const raw=source.slice(i,j+1);i=j+1;
  if(/^<!doctype\s+html\s*>$/i.test(raw)){if(doctype||nodes.length||root.children.some(n=>n.tag==='#text'&&n.text.trim()))issue(start,'Đặt một khai báo <!DOCTYPE html> ở đầu tệp, trước html.');doctype=true;continue;}
  if(/^<!/i.test(raw)){issue(start,'Kiểm tra khai báo. Bài này dùng <!DOCTYPE html>.');continue;}
  const closing=raw.match(/^<\/\s*([a-z][\w:-]*)\s*>$/i);
  if(closing){const tag=closing[1].toLowerCase();if(lessonVoidTags.has(tag)){issue(start,`<${tag}> là thẻ đơn, hãy bỏ </${tag}>.`);continue;}
   let found=-1;for(let k=stack.length-1;k>0;k--)if(stack[k].tag===tag){found=k;break;}
   if(found<0){issue(start,`Có </${tag}> nhưng chưa thấy thẻ mở tương ứng.`);continue;}
   if(found!==stack.length-1)issue(start,`Đang ở trong <${stack[stack.length-1].tag}>. Hãy đóng </${stack[stack.length-1].tag}> trước </${tag}>.`);
   stack[found].closed=true;stack.length=found;continue;
  }
  const opening=raw.match(/^<([a-z][\w:-]*)([\s\S]*?)>$/i);
  if(!opening){issue(start,'Kiểm tra tên thẻ và hai dấu < >.');continue;}
  const tag=opening[1].toLowerCase(),attrs={};let rest=opening[2].replace(/\/\s*$/,'');
  const attrPattern=/([^\s=<>"'`/]+)(?:\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s"'=<>`]+)))?/g;let a;
  while((a=attrPattern.exec(rest)))attrs[a[1].toLowerCase()]=a[2]??a[3]??a[4]??'';
  const node={tag,attrs,children:[],parent:stack[stack.length-1],line:lineAt(start),closed:lessonVoidTags.has(tag)};node.parent.children.push(node);nodes.push(node);
  if(lessonVoidTags.has(tag))continue;
  if(/\/\s*>$/.test(raw))issue(start,`Theo mẫu HTML của bài, <${tag}> cần thẻ đóng </${tag}> riêng. Dấu /> không tự đóng phần tử này.`);
  stack.push(node);
  if(['script','style','title','textarea'].includes(tag)){
   const close=new RegExp('</'+tag+'\\s*>','ig');close.lastIndex=i;const match=close.exec(source);
   if(match){text(source.slice(i,match.index));node.closed=true;stack.pop();i=close.lastIndex;}
   else{text(source.slice(i));i=source.length;}
  }
 }
 for(const node of stack.slice(1))issue(source.length,`Theo quy ước viết đủ thẻ của bài thực hành, còn thiếu </${node.tag}> (mở ở dòng ${node.line}).`);
 return {root,nodes,issues,doctype};
}
function lessonText(node){return node.tag==='#text'?node.text:node.children.map(lessonText).join(' ');}
function meaningfulLessonText(node){return !!node&&lessonText(node).replace(/&(?:nbsp|#160|#x0*a0);/ig,' ').replace(/\s/g,'').length>0;}
function withinLesson(node,parent){for(let p=node.parent;p;p=p.parent)if(p===parent)return true;return false;}
function checkLessonWork(source,mission='foundation'){
 const parsed=readLessonHTML(source),{nodes,issues}=parsed,html=nodes.filter(n=>n.tag==='html'),head=nodes.find(n=>n.tag==='head'&&n.parent===html[0]),body=nodes.find(n=>n.tag==='body'&&n.parent===html[0]);
 const find=(tag,parent)=>nodes.filter(n=>n.tag===tag&&parent&&withinLesson(n,parent));
 const title=find('title',head).find(meaningfulLessonText),heading=find('h1',body).find(meaningfulLessonText),paragraphs=find('p',body).filter(meaningfulLessonText);
 const checks=[
  {key:'doctype',label:'Khai báo HTML',ok:parsed.doctype,fix:'Thêm <!DOCTYPE html> ở đầu tệp.'},
  {key:'structure',label:'Khung html, head, body',ok:html.length===1&&html[0].parent===parsed.root&&!!head&&!!body&&html[0].children.indexOf(head)<html[0].children.indexOf(body)&&nodes.filter(n=>n.tag==='head').length===1&&nodes.filter(n=>n.tag==='body').length===1,fix:'Viết một <html> bao <head> rồi <body>. Hai phần head và body cùng cấp.'},
  {key:'charset',label:'Mã hóa tiếng Việt',ok:find('meta',head).some(n=>n.attrs.charset?.toLowerCase()==='utf-8'),fix:'Trong <head>, thêm <meta charset="utf-8"> và lưu tệp theo UTF-8.'},
  {key:'title',label:'Tên tab có nội dung',ok:!!title,fix:'Viết tên trang giữa <title> và </title> bên trong <head>.'},
  {key:'h1',label:'Tiêu đề trang có nội dung',ok:!!heading,fix:'Trong <body>, viết một <h1> có lời chào hoặc tên trang.'},
  {key:'p',label:mission==='create'?'Hai đoạn văn có nội dung':'Đoạn văn có nội dung',ok:paragraphs.length>=(mission==='create'?2:1),fix:mission==='create'?'Viết ít nhất hai phần tử <p> có nội dung trong <body>.':'Viết ít nhất một <p> có nội dung trong <body>.'},

    const now=audioContext.currentTime;
    (kind==='good'?[523,659,784]:kind==='bad'?[240]:[560]).forEach((f,i)=>{

function classifier(prefix,items,selector,explain){
  let index=0,score=0,answered=false;
  const choices=$$(selector),progress=$(`#${prefix}-progress`),question=$(`#${prefix}-question`),feedback=$(`#${prefix}-feedback`),next=$(`#${prefix}-next`);
  function render(){
    answered=false;feedback.textContent='';feedback.classList.remove('good');
    const ended=index===items.length;
    progress.textContent=ended?`Hoàn thành · Đúng ${score}/${items.length}`:`Mục ${index+1}/${items.length} · Đúng ${score}`;
    question.textContent=ended?'Hoàn thành lượt phân loại!':items[index][0];
    choices.forEach(b=>b.disabled=ended);next.hidden=ended;next.disabled=true;
    next.textContent=index===items.length-1?'Xem kết quả':'Mục tiếp →';
    if(ended)feedback.textContent='Hãy chọn một ví dụ và giải thích vì sao em xếp vào nhóm đó.';
  }
  choices.forEach(b=>b.onclick=()=>{
    if(answered||index>=items.length)return;answered=true;
    const value=prefix==='tag'?b.dataset.tagKind:b.dataset.toolKind;
    const correct=value===items[index][1];if(correct)score++;
    choices.forEach(x=>x.disabled=true);feedback.textContent=(correct?'✓ Chính xác. ':'↪ Chưa đúng. ')+explain(items[index]);feedback.classList.toggle('good',correct);next.disabled=false;progress.textContent=`Mục ${index+1}/${items.length} · Đúng ${score}`;sound(correct?'good':'bad');
  });
  next.onclick=()=>{index++;render();};$(`#${prefix}-reset`).onclick=()=>{index=0;score=0;render();sound();};render();
}

function showWorkReview(){const value=$('#code-editor').value;if(value.length>30000){$('#editor-review').innerHTML='<p class="feedback">Mã quá dài. Hãy rút gọn dưới 30.000 kí tự để kiểm tra bài tập này.</p>';return null;}const r=checkLessonWork(value,activeMission);$('#editor-review').innerHTML=workFeedback(r);return r;}
function runCode(){const value=$('#code-editor').value;if(value.length>30000){showWorkReview();return;}preview('#editor-preview',value);const r=showWorkReview();const chrome=$('#editor-preview').parentElement.querySelector('.browser-chrome>span:last-child');chrome.textContent=r.title||'Chưa có tên tab trong head';const saved=storeDraft();$('#editor-status').textContent=(r.complete?'Đã đạt các yêu cầu của nhiệm vụ.':'Trang đã hiển thị; đọc các mục chưa đạt để tiếp tục sửa.')+(saved?' Bản nháp đã lưu trên trình duyệt này.':' Bản nháp đang giữ trong phiên này.');}
function loadMission(){clearTimeout(saveTimer);activeMission=$('#mission').value;if(activeMission!=='create')pauseProject();const task=lessonMissions[activeMission];$('#code-editor').value=drafts[activeMission]??task.starter;$('#mission-goal').innerHTML=esc(task.goal)+' <span id="mission-timer"></span>';$('#editor-hint-text').hidden=true;runCode();displayProjectTime();}
$('#mission').onchange=()=>{storeDraft();loadMission();sound();};
$('#run-code').onclick=()=>{runCode();sound();};
$('#restore-code').onclick=()=>{clearTimeout(saveTimer);$('#code-editor').value=lessonMissions[activeMission].starter;runCode();sound();};
$('#editor-hint').onclick=()=>{const show=$('#editor-hint-text').hidden;$('#editor-hint-text').hidden=!show;$('#editor-hint-text').textContent=lessonMissions[activeMission].hint;$('#editor-hint').setAttribute('aria-expanded',String(show));};
$('#code-editor').addEventListener('input',()=>{clearTimeout(saveTimer);$('#editor-review').innerHTML='<p class="pending">Mã đã đổi. Chạy và kiểm tra để cập nhật kết quả; các dấu đạt cũ không còn dùng cho bản này.</p>';$('#editor-status').textContent='Đang giữ bản nháp. Ctrl + Enter để chạy và kiểm tra.';saveTimer=setTimeout(storeDraft,350);});
$('#code-editor').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();runCode();sound();}});
$('#download-code').onclick=()=>{storeDraft();if(downloadUrl)URL.revokeObjectURL(downloadUrl);downloadUrl=URL.createObjectURL(new Blob(['\uFEFF',$('#code-editor').value],{type:'text/html;charset=utf-8'}));const link=document.createElement('a');link.href=downloadUrl;link.download='index.html';document.body.append(link);link.click();link.remove();$('#editor-status').textContent='Đã tạo index.html theo UTF-8. Mở tệp đã tải bằng trình duyệt để đối chiếu.';};
// Click/tap and native drag-and-drop are equivalent ways to assemble the same file.
let assemblyOrder=[];
function renderAssembly(){const used=new Set(assemblyOrder),shuffled=[4,2,7,1,5,0,6,3];$('#piece-bank').innerHTML=shuffled.filter(i=>!used.has(assemblyPieces[i].id)).map(i=>`<button class="piece" draggable="true" data-piece="${assemblyPieces[i].id}" title="Chọn hoặc kéo mảnh này vào tệp">${esc(assemblyPieces[i].text)}</button>`).join('')||'<p class="teacher-note">Đã dùng đủ mảnh. Em vẫn có thể đổi thứ tự hoặc trả mảnh về kho.</p>';$('#piece-slots').innerHTML=assemblyOrder.map((id,i)=>{const p=assemblyPieces.find(p=>p.id===id);return `<li><code>${esc(p.text)}</code><div class="piece-tools"><button class="action" data-move="${i}" data-dir="-1" aria-label="Đưa mảnh ${i+1} lên" ${i===0?'disabled':''}>↑</button><button class="action" data-move="${i}" data-dir="1" aria-label="Đưa mảnh ${i+1} xuống" ${i===assemblyOrder.length-1?'disabled':''}>↓</button><button class="action" data-remove="${i}" aria-label="Trả mảnh ${i+1} về kho">×</button></div></li>`;}).join('')||'<li class="empty-slot">Chọn mảnh trong kho hoặc kéo thả vào đây.</li>';
 $$('[data-piece]').forEach(b=>{b.onclick=()=>addPiece(b.dataset.piece);b.ondragstart=e=>{e.dataTransfer.setData('text/plain',b.dataset.piece);e.dataTransfer.effectAllowed='move';};});
 $$('[data-move]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.move),j=i+Number(b.dataset.dir);[assemblyOrder[i],assemblyOrder[j]]=[assemblyOrder[j],assemblyOrder[i]];renderAssembly();$('#assembly-feedback').textContent='Đã đổi thứ tự. Kiểm tra lại để nhận phản hồi mới.';});
 $$('[data-remove]').forEach(b=>b.onclick=()=>{assemblyOrder.splice(Number(b.dataset.remove),1);renderAssembly();$('#assembly-feedback').textContent='Đã trả mảnh về kho. Chọn lại vị trí phù hợp.';});
}
function addPiece(id){if(!assemblyPieces.some(p=>p.id===id)||assemblyOrder.includes(id))return;assemblyOrder.push(id);renderAssembly();$('#assembly-feedback').textContent=`Đã đặt ${assemblyOrder.length}/8 mảnh. Em có thể đổi thứ tự trước khi kiểm tra.`;sound();}
$('#piece-slots').ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='move';};$('#piece-slots').ondrop=e=>{e.preventDefault();addPiece(e.dataTransfer.getData('text/plain'));};
function checkAssembly(){const count=assemblyPieces.filter((p,i)=>assemblyOrder[i]===p.id).length,first=assemblyPieces.findIndex((p,i)=>assemblyOrder[i]!==p.id),good=count===8;$('#assembly-feedback').classList.toggle('good',good);$('#assembly-feedback').textContent=good?'✓ Đúng 8/8 vị trí theo mẫu. Hãy giải thích vì sao head và body cùng nằm trong html.':`${count}/8 vị trí đúng theo mẫu; đã dùng ${assemblyOrder.length}/8 mảnh. Bước ${first+1}: cần ${assemblyPieces[first].text}. ${assemblyPieces[first].why}`;sound(good?'good':'bad');}
$('#assembly-check').onclick=checkAssembly;$('#assembly-hint').onclick=()=>{const first=assemblyPieces.findIndex((p,i)=>assemblyOrder[i]!==p.id);$('#assembly-feedback').textContent=first<0?'Em đã xếp đúng. Hãy giải thích quan hệ chứa của html, head và body.':`Gợi ý bước ${first+1}: ${assemblyPieces[first].why}`;};$('#assembly-reset').onclick=()=>{assemblyOrder=[];renderAssembly();$('#assembly-feedback').textContent='Bắt đầu lượt mới. Mỗi mảnh chỉ dùng một lần.';};renderAssembly();
let repairIndex=0;const repairDrafts={};
function loadRepair(){repairIndex=Number($('#repair-task').value);const t=repairTasks[repairIndex];$('#repair-code').value=repairDrafts[repairIndex]??t.starter;$('#repair-goal').textContent=t.goal;$('#repair-feedback').textContent='Tự sửa mã trước, rồi kiểm tra. Gợi ý không tự điền lời giải.';$('#repair-feedback').classList.remove('good');$('#repair-hint-text').hidden=true;preview('#repair-preview',$('#repair-code').value);}
function assessRepair(source,index){const parsed=readLessonHTML(source);if(parsed.issues.length)return {ok:false,message:`Dòng ${parsed.issues[0].line}: ${parsed.issues[0].message}`};
 const t=repairTasks[index];if(t.kind==='title'){const r=checkLessonWork(source),need=r.checks.filter(c=>['structure','title','h1'].includes(c.key)),missing=need.find(c=>!c.ok);return {ok:!missing,message:missing?missing.fix:'Title đã ở head và có nội dung. H1 đã ở body.'};}
 const ps=parsed.nodes.filter(n=>n.tag==='p'&&meaningfulLessonText(n));if(!ps.length)return {ok:false,message:'Giữ một p có nội dung cho đoạn văn.'};
 if(t.kind==='nest'){const em=parsed.nodes.find(n=>n.tag==='em'&&meaningfulLessonText(n)&&ps.some(p=>withinLesson(n,p)));return {ok:!!em,message:em?'Em nằm trong p; thứ tự mở và đóng thẻ đã đúng.':'Giữ một em có nội dung nằm bên trong p để nhấn mạnh cụm từ.'};}
 const p=ps[0],br=p.children.findIndex(n=>n.tag==='br'),before=p.children.slice(0,br).map(lessonText).join(' '),after=p.children.slice(br+1).map(lessonText).join(' '),ok=ps.length===1&&br>=0&&before.includes('Dòng thứ nhất')&&after.includes('Dòng thứ hai');return {ok,message:ok?'Một p chứa hai câu, br nằm đúng giữa hai câu và không có thẻ đóng.':'Giữ cả hai câu trong một p và chèn <br> giữa “Dòng thứ nhất” và “Dòng thứ hai”.'};
}
$('#repair-task').onchange=()=>{loadRepair();sound();};$('#repair-code').oninput=()=>{repairDrafts[repairIndex]=$('#repair-code').value;$('#repair-feedback').textContent='Mã đã đổi. Kiểm tra bản sửa để cập nhật nhận xét.';$('#repair-feedback').classList.remove('good');};
$('#repair-check').onclick=()=>{const source=$('#repair-code').value;if(source.length>30000){$('#repair-feedback').textContent='Hãy rút gọn mã dưới 30.000 kí tự.';return;}const r=assessRepair(source,repairIndex);preview('#repair-preview',source);$('#repair-feedback').textContent=(r.ok?'✓ Đã sửa đạt yêu cầu. ':'↪ Cần sửa tiếp. ')+r.message;$('#repair-feedback').classList.toggle('good',r.ok);sound(r.ok?'good':'bad');};
$('#repair-hint').onclick=()=>{$('#repair-hint-text').hidden=!$('#repair-hint-text').hidden;$('#repair-hint-text').textContent=repairTasks[repairIndex].hint;};$('#repair-reset').onclick=()=>{delete repairDrafts[repairIndex];loadRepair();};loadRepair();
const liveTreeDefault='<!DOCTYPE html>\n<html>\n<head>\n  <title>Lớp 12</title>\n</head>\n<body>\n  <h1>Xin chào</h1>\n  <p>Nhóm <em>bạn bè</em></p>\n  <p>Cùng học HTML.</p>\n</body>\n</html>';
function buildLiveTree(){const source=$('#live-tree-code').value;if(source.length>10000){$('#live-tree-note').textContent='Dùng ví dụ dưới 10.000 kí tự để cây dễ quan sát.';$('#live-tree').replaceChildren();return;}const r=readLessonHTML(source);$('#live-tree').classList.remove('stale');if(r.issues.length){$('#live-tree').replaceChildren();$('#live-tree-note').textContent=`Chưa dựng cây. Dòng ${r.issues[0].line}: ${r.issues[0].message}`;return;}if(r.nodes.length>60){$('#live-tree').replaceChildren();$('#live-tree-note').textContent='Ví dụ có quá nhiều phần tử. Rút gọn dưới 60 phần tử để dễ đọc cây.';return;}
 const map=new Map(r.nodes.map((n,i)=>[n,i]));function branch(node){const kids=node.children.filter(n=>n.tag!=='#text');return `<li><button class="live-node" data-live-node="${map.get(node)}">${esc('<'+node.tag+'>')}</button>${kids.length?'<ul>'+kids.map(branch).join('')+'</ul>':''}</li>`;}
 $('#live-tree').innerHTML='<ul>'+r.root.children.filter(n=>n.tag!=='#text').map(branch).join('')+'</ul>';$('#live-tree-note').textContent=r.nodes.length?`Có ${r.nodes.length} phần tử được viết trong mã. Chạm một nút để tìm cha và con trực tiếp.`:'Chưa có phần tử. Thêm một p hoặc tài liệu html vào khung mã.';
 $$('[data-live-node]').forEach(b=>b.onclick=()=>{const n=r.nodes[Number(b.dataset.liveNode)],children=n.children.filter(c=>c.tag!=='#text');$$('[data-live-node]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('#live-tree-note').textContent=`<${n.tag}>: ${n.parent.tag==='#document'?'không có phần tử cha trong đoạn mã này':'cha trực tiếp là <'+n.parent.tag+'>'}. ${children.length?'Con trực tiếp: '+children.map(c=>'<'+c.tag+'>').join(', ')+'.':'Không có phần tử con.'}`;});}
$('#live-tree-code').value=liveTreeDefault;$('#live-tree-build').onclick=()=>{buildLiveTree();sound();};$('#live-tree-reset').onclick=()=>{$('#live-tree-code').value=liveTreeDefault;buildLiveTree();};$('#live-tree-code').oninput=()=>{$('#live-tree').classList.add('stale');$$('[data-live-node]').forEach(b=>b.disabled=true);$('#live-tree-note').textContent='Mã đã đổi. Nhấn “Dựng cây từ mã” để xem cấu trúc mới.';};buildLiveTree();
let projectRemaining=180,projectTimer=null,projectEnds=0,projectStarted=false;
function displayProjectTime(){const t=`${String(Math.floor(projectRemaining/60)).padStart(2,'0')}:${String(projectRemaining%60).padStart(2,'0')}`;$('#project-time').textContent=t;const label=$('#mission-timer');if(label)label.textContent=activeMission==='create'&&projectStarted?'⏱ '+t+(projectTimer===null?' · tạm dừng':''):'';}
function pauseProject(){if(projectTimer!==null){projectRemaining=Math.max(0,Math.ceil((projectEnds-Date.now())/1000));clearInterval(projectTimer);projectTimer=null;$('#project-start').textContent=projectRemaining?'▶ Tiếp tục':'▶ Bắt đầu lại';$('#project-time-status').textContent=projectRemaining?'Đã tạm dừng.':'Hết giờ. Cùng kiểm tra sản phẩm và giải thích cách sửa.';displayProjectTime();}}
$('#project-start').onclick=()=>{if(projectTimer!==null){pauseProject();return;}if(!projectRemaining)projectRemaining=180;projectStarted=true;projectEnds=Date.now()+projectRemaining*1000;$('#project-start').textContent='Ⅱ Tạm dừng';$('#project-time-status').textContent='Có thể sang nhiệm vụ 3 để viết mã, đồng hồ vẫn chạy.';projectTimer=setInterval(()=>{projectRemaining=Math.max(0,Math.ceil((projectEnds-Date.now())/1000));displayProjectTime();if(!projectRemaining){pauseProject();notify('Hết 3 phút. Hãy chạy kiểm tra và đọc các mục chưa đạt.');sound('good');}},250);displayProjectTime();};
$('#project-reset').onclick=()=>{pauseProject();projectRemaining=180;projectStarted=false;$('#project-start').textContent='▶ Bắt đầu';$('#project-time-status').textContent='Đồng hồ chạy ở slide dự án và xưởng nhiệm vụ 3.';displayProjectTime();};
$('#project-open').onclick=()=>{storeDraft();$('#mission').value='create';loadMission();showSlide(13);};$('#project-review').onclick=()=>{if(activeMission==='create')storeDraft();const r=checkLessonWork(drafts.create??lessonMissions.create.starter,'create');$('#project-feedback').innerHTML=workFeedback(r);};
// Teacher guidance follows the slide without exposing answers in student tasks.
const notePanel=document.createElement('aside');notePanel.className='teacher-panel';notePanel.hidden=true;notePanel.setAttribute('aria-label','Gợi ý giáo viên');notePanel.innerHTML='<strong>Gợi ý tổ chức</strong><p id="teacher-note-text"></p>';document.body.append(notePanel);const noteButton=document.createElement('button');noteButton.className='tool';noteButton.id='teacher-toggle';noteButton.textContent='💡 Gợi ý GV';noteButton.setAttribute('aria-expanded','false');$('#fullscreen').before(noteButton);
function updateTeacherNote(i){$('#teacher-note-text').textContent=teacherNotes[i];}
noteButton.onclick=()=>{notePanel.hidden=!notePanel.hidden;noteButton.setAttribute('aria-expanded',String(!notePanel.hidden));};document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='n'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!$('#toc').open&&!e.target.closest('input,textarea,select,[contenteditable="true"]'))noteButton.click();});
window.addEventListener('pagehide',()=>{clearTimeout(saveTimer);storeDraft();if(downloadUrl)URL.revokeObjectURL(downloadUrl);resetPipe();pauseProject();});document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseProject();});
loadMission();displayProjectTime();updateTeacherNote(0);showSlide(0,false);
</script>
